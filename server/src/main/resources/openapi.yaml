openapi: 3.0.0

info:
  title: API Performance Monitor
  version: 1.0.0
  description: API for monitoring HTTP endpoints and collecting performance metrics

servers:
  - url: http://localhost:8080

paths:

  /auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /users:
    get:
      summary: List users
      responses:
        "200":
          description: List of users

  /users/{id}:
    get:
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User retrieved successfully

  /endpoints:
    get:
      summary: List monitored endpoints
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of monitored endpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Endpoint'

    post:
      summary: Create monitored endpoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
      responses:
        "201":
          description: Endpoint successfully created

  /endpoints/{id}:
    delete:
      summary: Delete monitored endpoint
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Endpoint successfully deleted

  /metrics:
    get:
      summary: Get all metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metric'

  /metrics/check:
    post:
      summary: Execute endpoint check
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        "200":
          description: Monitoring result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'

  /metrics/{endpoint}:
    get:
      summary: Get endpoint metrics
      security:
        - bearerAuth: []
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Endpoint metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metric'

  /metrics/{endpointId}/summary:
    get:
      summary: Get aggregated metrics summary
      security:
        - bearerAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Aggregated monitoring metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedMetric'

  /agent/register:
    post:
      summary: Register endpoint through local agent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateEndpointRequest'
      responses:
        "200":
          description: Agent endpoint successfully created

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    RegisterResponse:
      type: object
      properties:
        userId:
          type: integer

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string

    CreateEndpointRequest:
      type: object
      required:
        - url
        - name
        - intervalSeconds
      properties:
        url:
          type: string
        name:
          type: string
        intervalSeconds:
          type: integer
        notification:
          type: object
        alertRule:
          type: object
          nullable: true

    AgentCreateEndpointRequest:
      type: object
      required:
        - name
        - intervalSeconds
      properties:
        name:
          type: string
        intervalSeconds:
          type: integer

    CheckRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string

    Endpoint:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        url:
          type: string
        name:
          type: string
        intervalSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time

    Metric:
      type: object
      properties:
        endpoint:
          type: string
        timestamp:
          type: string
          format: date-time
        latency:
          type: integer
        statusCode:
          type: integer

    AggregatedMetric:
      type: object
      properties:
        endpoint:
          type: string

        startTime:
          type: string
          format: date-time

        endTime:
          type: string
          format: date-time

        averageLatency:
          type: number

        totalRequests:
          type: integer

        errorRate:
          type: number

        throughput:
          type: integer

        uptime:
          type: integer

        percentile95:
          type: integer

        percentile99:
          type: integer

        statusCodeDistribution:
          type: object
          additionalProperties:
            type: integer